apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rsde.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rsde.labels" . | nindent 4 }}
data:
  config.toml: |
    # RSDE apiserver 配置文件
    # 由 Helm chart 自动生成

    [apiserver]
    listen_address = {{ .Values.config.apiserver.listen_address | quote }}
    log_level = {{ .Values.config.apiserver.log_level | quote }}
    cors_enabled = {{ .Values.config.apiserver.cors_enabled }}

    [remote_ocr]
    perm_url = {{ .Values.config.remote_ocr.perm_url | quote }}
    start_url = {{ .Values.config.remote_ocr.start_url | quote }}
    status_url = {{ .Values.config.remote_ocr.status_url | quote }}
    auth_token = {{ .Values.config.remote_ocr.auth_token | quote }}
    auth_uuid = {{ .Values.config.remote_ocr.auth_uuid | quote }}
    auth_cookie = {{ .Values.config.remote_ocr.auth_cookie | quote }}
    origin = {{ .Values.config.remote_ocr.origin | quote }}
    mode = {{ .Values.config.remote_ocr.mode | quote }}
    timeout_secs = {{ .Values.config.remote_ocr.timeout_secs }}
    poll_interval_ms = {{ .Values.config.remote_ocr.poll_interval_ms }}
    poll_max_attempts = {{ .Values.config.remote_ocr.poll_max_attempts }}
    poll_initial_delay_ms = {{ .Values.config.remote_ocr.poll_initial_delay_ms }}
    accept_invalid_certs = {{ .Values.config.remote_ocr.accept_invalid_certs }}

    [image_hosting]
    storage_dir = {{ .Values.config.image_hosting.storage_dir | quote }}
    cleanup_interval_secs = {{ .Values.config.image_hosting.cleanup_interval_secs }}
    file_expire_secs = {{ .Values.config.image_hosting.file_expire_secs }}

    [anybox]
    redis_url = {{ .Values.config.anybox.redis_url | quote }}
    key_prefix = {{ .Values.config.anybox.key_prefix | quote }}
    cleanup_interval_secs = {{ .Values.config.anybox.cleanup_interval_secs }}

    {{- if .Values.config.object_storage }}
    [object_storage]
    access_key = {{ required "config.object_storage.access_key is required when object_storage is configured" .Values.config.object_storage.access_key | quote }}
    secret_key = {{ required "config.object_storage.secret_key is required when object_storage is configured" .Values.config.object_storage.secret_key | quote }}
    bucket = {{ required "config.object_storage.bucket is required when object_storage is configured" .Values.config.object_storage.bucket | quote }}
    region = {{ required "config.object_storage.region is required when object_storage is configured" .Values.config.object_storage.region | quote }}
    {{- with .Values.config.object_storage.domain }}
    domain = {{ . | quote }}
    {{- end }}
    {{- with .Values.config.object_storage.public_base_url }}
    public_base_url = {{ . | quote }}
    {{- end }}
    upload_token_ttl_secs = {{ .Values.config.object_storage.upload_token_ttl_secs | default 3600 }}
    private_url_ttl_secs = {{ .Values.config.object_storage.private_url_ttl_secs | default 3600 }}
    use_https = {{ .Values.config.object_storage.use_https | default true }}
    {{- with .Values.config.object_storage.path_prefix }}
    path_prefix = {{ . | quote }}
    {{- end }}
    bucket_is_private = {{ .Values.config.object_storage.bucket_is_private | default false }}
    {{- end }}

    {{- if .Values.config.datalink_engine }}
    [datalink_engine]
    backend = {{ .Values.config.datalink_engine.backend | default "memory" | quote }}

    {{- with .Values.config.datalink_engine.mysql }}
    [datalink_engine.mysql]
    host = {{ .host | quote }}
    port = {{ .port }}
    user = {{ .user | quote }}
    password = {{ .password | quote }}
    database = {{ .database | quote }}
    max_connections = {{ .max_connections }}
    min_connections = {{ .min_connections }}
    connect_timeout_secs = {{ .connect_timeout_secs }}
    {{- end }}
    {{- end }}

    {{- if .Values.config.nodemanage }}
    [nodemanage]
    table_prefix = {{ .Values.config.nodemanage.table_prefix | default "node_" | quote }}
    {{- with .Values.config.nodemanage.rsagent_package_url }}
    rsagent_package_url = {{ . | quote }}
    {{- end }}
    install_root = {{ .Values.config.nodemanage.install_root | default "/opt/rsagent" | quote }}
    register_callback_url = {{ .Values.config.nodemanage.register_callback_url | default "http://127.0.0.1:3000/api/nodes/agent/sync" | quote }}
    register_wait_timeout_secs = {{ .Values.config.nodemanage.register_wait_timeout_secs | default 30 }}
    ssh_connect_timeout_secs = {{ .Values.config.nodemanage.ssh_connect_timeout_secs | default 10 }}

    {{- range .Values.config.nodemanage.install_plugins }}
    [[nodemanage.install_plugins]]
    name = {{ .name | quote }}
    version = {{ .version | quote }}
    {{- with .package_url }}
    package_url = {{ . | quote }}
    {{- end }}
    {{- end }}

    [nodemanage.heartbeat]
    result_table_name = {{ .Values.config.nodemanage.heartbeat.result_table_name | default "nm_node_heartbeat" | quote }}
    metric_name = {{ .Values.config.nodemanage.heartbeat.metric_name | default "nm_node_heartbeat" | quote }}
    query_template = {{ .Values.config.nodemanage.heartbeat.query_template | default "query $metric_name where node_id = $node_id and agent_id = $agent_id and node_ip = $node_ip between $start_at and $end_at" | quote }}
    storage_cluster = {{ .Values.config.nodemanage.heartbeat.storage_cluster | default "default" | quote }}
    interval_seconds = {{ .Values.config.nodemanage.heartbeat.interval_seconds | default 60 }}
    retention_days = {{ .Values.config.nodemanage.heartbeat.retention_days | default 7 }}
    refresh_interval_secs = {{ .Values.config.nodemanage.heartbeat.refresh_interval_secs | default 60 }}
    status_window_secs = {{ .Values.config.nodemanage.heartbeat.status_window_secs | default 300 }}

    {{- with .Values.config.nodemanage.mysql }}
    [nodemanage.mysql]
    host = {{ .host | quote }}
    port = {{ .port }}
    user = {{ .user | quote }}
    password = {{ .password | quote }}
    database = {{ .database | quote }}
    max_connections = {{ .max_connections }}
    min_connections = {{ .min_connections }}
    connect_timeout_secs = {{ .connect_timeout_secs }}
    {{- end }}
    {{- end }}

    {{- if .Values.config.prompt }}
    [prompt]
    table_prefix = {{ .Values.config.prompt.table_prefix | quote }}

    [prompt.mysql]
    host = {{ .Values.config.prompt.mysql.host | quote }}
    port = {{ .Values.config.prompt.mysql.port }}
    user = {{ .Values.config.prompt.mysql.user | quote }}
    password = {{ .Values.config.prompt.mysql.password | quote }}
    database = {{ .Values.config.prompt.mysql.database | quote }}
    max_connections = {{ .Values.config.prompt.mysql.max_connections }}
    min_connections = {{ .Values.config.prompt.mysql.min_connections }}
    connect_timeout_secs = {{ .Values.config.prompt.mysql.connect_timeout_secs }}
    {{- end }}
